<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | FUTMinna MATLAB Space</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --mw-blue: #0747A3; --mw-blue-dark: #052F6B; --mw-blue-deeper: #000000;
  --mw-blue-light: #4E9BF0; --mw-teal: #D6300C; --mw-teal-dark: #FF6B3D;
  --mw-yellow: #F26A43; --mw-orange: #D6300C; --mw-red: #A2142F;
  --mw-white: #FFFFFF; --mw-light: #0A1629; --mw-light-gray: #0E1F3B;
  --mw-border: rgba(148,163,184,0.18); --mw-text: #E7EDF6;
  --mw-text-secondary: #A6B4CA; --mw-text-muted: #6B7C96;
  --mw-shadow: 0 4px 20px rgba(0,0,0,0.25); --mw-shadow-lg: 0 12px 40px rgba(0,0,0,0.35);
  --mw-radius: 10px; --mw-radius-lg: 16px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--mw-text);
  background:
    linear-gradient(180deg, rgba(3,11,24,0.9) 0%, rgba(10,22,41,0.82) 50%, rgba(3,11,24,0.92) 100%),
    url('/images/decode-your-world-bg.jpg') center/cover no-repeat fixed;
  background-size: cover; min-height: 100vh;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4%; height: 64px;
  background: linear-gradient(135deg, var(--mw-blue-deeper), var(--mw-blue-dark));
  color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.topbar h1 { font-size: 1rem; font-weight: 700; }
.topbar h1 span { color: var(--mw-teal); }
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); }
.topbar nav { display: flex; gap: 10px; align-items: center; }
.topbar nav a {
  color: rgba(255,255,255,0.7); text-decoration: none; font-size: .82rem; font-weight: 500;
  padding: 8px 16px; border-radius: 8px; transition: all 0.25s var(--ease-out);
}
.topbar nav a:hover { color: white; background: rgba(255,255,255,0.08); }
.topbar nav a.site-link { border: 1px solid rgba(255,255,255,0.15); }
.topbar nav a.active-link { background: rgba(255,255,255,0.12); color: white; }
.topbar nav a.logout-btn { background: var(--mw-red); color: white; font-weight: 600; }

.container { max-width: 560px; margin: 40px auto; padding: 0 4% 48px; }
.page-card {
  background: rgba(255,255,255,0.05); border-radius: var(--mw-radius-lg);
  border: 1px solid var(--mw-border); padding: 40px; box-shadow: var(--mw-shadow);
  backdrop-filter: blur(12px);
}
.page-card h2 { font-size: 1.5rem; margin-bottom: 8px; color: white; }
.page-card .subtitle { color: var(--mw-text-muted); font-size: .92rem; margin-bottom: 28px; }

.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-weight: 600; font-size: .88rem; color: var(--mw-text-secondary); margin-bottom: 8px;
}
.form-group input {
  width: 100%; padding: 14px 18px; border: 1.5px solid var(--mw-border); border-radius: var(--mw-radius);
  font-size: 1rem; font-family: inherit; background: rgba(10,22,41,0.6); color: var(--mw-text);
  transition: all 0.25s var(--ease-out);
}
.form-group input:focus {
  outline: none; border-color: var(--mw-teal); box-shadow: 0 0 0 3px rgba(214,48,12,0.12);
  background: rgba(255,255,255,0.08);
}
.form-group input::placeholder { color: var(--mw-text-muted); }

.pw-wrap { position: relative; }
.pw-wrap input { width: 100%; padding-right: 48px; }
.pw-toggle {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--mw-text-muted); transition: color 0.2s; display: flex;
}
.pw-toggle:hover { color: white; }

.btn-save {
  width: 100%; padding: 15px 24px; border: none; border-radius: var(--mw-radius);
  background: var(--mw-teal-dark); color: white; font-weight: 700; font-size: 1rem;
  cursor: pointer; transition: all 0.25s var(--ease-out); font-family: inherit;
}
.btn-save:hover { background: #B72408; transform: translateY(-1px); }

.msg {
  margin-bottom: 20px; padding: 14px 18px; border-radius: var(--mw-radius);
  font-size: .92rem; font-weight: 500;
}
.msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.15); color: #FCA5A5; }
.msg.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.15); color: #4ade80; }

@media(max-width: 768px) {
  .topbar { flex-direction: column; height: auto; padding: 14px 4%; gap: 10px; }
  .page-card { padding: 28px 20px; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand">
    <img class="topbar-logo" src="/images/futminna_matlab_space_logo.jpeg" alt="FUTMinna MATLAB Space logo">
    <h1>FUTMinna <span>MATLAB</span> Space &mdash; Change Password</h1>
  </div>
  <nav>
    <a href="/admin" class="site-link">Dashboard</a>
    <a href="/admin/attendance">Attendance</a>
    <a href="/admin/certificates">Certificates</a>
    <a href="/admin/logout" class="logout-btn">Sign Out</a>
  </nav>
</div>

<div class="container">
  <div class="page-card">
    <h2>Change Password</h2>
    <p class="subtitle">Update your admin account password</p>

    {% if error %}
    <div class="msg error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="msg success">{{ success }}</div>
    {% endif %}

    <form method="POST" action="/admin/change-password">
      <div class="form-group">
        <label>Current Password</label>
        <div class="pw-wrap">
          <input type="password" name="current_password" id="curPw" placeholder="Enter current password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('curPw', this)" aria-label="Show password">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <div class="pw-wrap">
          <input type="password" name="new_password" id="newPw" placeholder="Enter new password (min 6 chars)" required>
          <button type="button" class="pw-toggle" onclick="togglePw('newPw', this)" aria-label="Show password">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" name="confirm_password" id="conPw" placeholder="Confirm new password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('conPw', this)" aria-label="Show password">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-save">Update Password</button>
    </form>
  </div>
</div>
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    inp.type = 'password';
    btn.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}
</script>
</body>
</html>
